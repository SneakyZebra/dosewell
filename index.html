<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="dosewell-drugbank-gateway" content="">
  <meta name="theme-color" content="#176557">
  <meta name="description" content="Keep a personal medication list, plan dose reminders, and review possible medication interactions.">
  <title>Dosewell | Medication Planner</title>
  <link rel="manifest" href="./app.webmanifest">
  <meta name="apple-mobile-web-app-title" content="Dosewell">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="./app-192.png">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a href="#main" class="skip">Skip to content</a>
  <header class="mast"><div class="header-inner">
    <a class="brand" href="#overview" aria-label="Dosewell by Williams Industries, overview"><img src="./icon.svg" height="38" width="38" alt=""><span class="brand-type"><span>Dosewell</span><small>By Williams Industries</small></span></a>
    <nav aria-label="Main navigation" id="nav"></nav>
    <button class="top-help" data-action="help" aria-label="Help and privacy"><span data-icon="help"></span><span>Help</span></button>
  </div></header>
  <div id="new-address" class="setup-prompt" hidden><span>Dosewell has a new address.</span><a class="btn small primary" href="https://sneakyzebra.github.io/dosewell/">Open the new site</a><a class="text-link" href="./move.html">Transfer my saved plan</a></div>
  <div id="native-banner" class="setup-prompt" hidden><span></span><a class="btn small outline" href="#reminders">Reminders</a></div>
  <div id="storage-warning" role="alert" hidden></div>
  <div id="alarms" aria-live="assertive"></div>
  <div id="setup-prompt" class="setup-prompt" hidden><span>Your medication schedule is saved.</span><button class="btn small primary" data-action="phone-setup">Set up phone reminders</button><button class="icon-button" data-action="dismiss-setup" aria-label="Dismiss phone setup"><span data-icon="close"></span></button></div>
  <main id="main" tabindex="-1"></main>
  <footer><span data-icon="lock"></span> Your medication list is saved on this device.<button data-action="help">Privacy &amp; help</button><a class="app-download-link" href="./mobile-apps.html">Dosewell apps</a><a class="plan-move-link" href="./move.html">Transfer a saved plan</a></footer>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <div id="toast" role="status" hidden></div>
  <noscript>Enable JavaScript to use the medication planner and reminders.</noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
