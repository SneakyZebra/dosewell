name: Check iPhone app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['dosewell-iphone-project.zip']
permissions:
  contents: read
jobs:
  iphone:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build iPhone and simulator apps
        run: |
          unzip -q dosewell-iphone-project.zip -d source
          cd source
          xcodebuild -project Dosewell.xcodeproj -scheme Dosewell -configuration Release -destination 'generic/platform=iOS' -derivedDataPath device CODE_SIGNING_ALLOWED=NO build
          xcodebuild -project Dosewell.xcodeproj -scheme Dosewell -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath simulator build
      - name: Launch Dosewell on a simulated iPhone
        run: |
          set -euo pipefail
          cd source
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for k,v in sorted(json.load(sys.stdin)["devices"].items(), reverse=True) if "iOS-" in k and int(k.split("iOS-")[-1].split("-")[0]) >= 26 for d in v if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" simulator/Build/Products/Debug-iphonesimulator/Dosewell.app
          xcrun simctl launch "$device" org.williamsindustries.dosewell --dosewell-smoke
          folder=$(xcrun simctl get_app_container "$device" org.williamsindustries.dosewell data)
          for attempt in {1..45}; do test -f "$folder/Documents/dosewell-smoke.txt" && break; sleep 2; done
          cat "$folder/Documents/dosewell-smoke.txt"
          grep -qx 'Dosewell planner and native alarm controls ready' "$folder/Documents/dosewell-smoke.txt"
